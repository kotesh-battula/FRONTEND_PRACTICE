<!DOCTYPE html>
<html>
    <head>
        <title>Form Practice</title>
    </head>
    <body>
        <h1><b>Student Details</b></h1>
        <form>
            <table>
                <tr>
                    <td><label>Roll no:</label></td>
                    <td><input type="text" width="10" placeholder="enter Roll no"/></td>
                </tr>
                <tr>
                    <td><label>Student name:</label></td>
                    <td><input type="text" width="10" placeholder="firstname"/> - <input type="text" placeholder="last name" width="10"</td>
                </tr>
                <tr>
                    <td><label>Father's Name:</label></td>
                    <td><input type="text" placeholder="Enter father's name"/></td>
                </tr>
                <tr>
                    <td><label>Date of birth:</label></td>
                    <td><input type="text" placeholder="day"/>  <input type="text" placeholder="Month"/>  <input type="text" placeholder="Year"/></td>
                </tr>
                <tr>
                    <td><label>Mobuile No:</label></td>
                    <td><input type="text" value="+91" readonly/>  <input type="text" placeholder="enter number"/></td>
                </tr>
                <tr>
                    <td><label>Email:</label></td>
                    <td><input type="email" placeholder="Enter email"/></td>
                </tr>
                <tr>
                    <td><label>Password:</label></td>
                    <td><input type="text" placeholder="enter password"/></td>
                </tr>
                <tr>
                    <td><label>Gender:</label></td>
                    <td><input type="radio" name=""/><label>Male</label>  <input type="radio" name=""/><label>female</label>  <input type="radio" name=""/><label>Others</label></td>
                </tr>
                <tr>
                    <td><label>Department:</label></td>
                    <td><select name="k"><option>--select--</option><option>IT</option><option>CSE</option><option>ECE</option><option>EEE</option></select></td>
                </tr>
                <tr>
                    <td><label>Student Photo:</label></td>
                    <td><input type="file" placeholder="choose file"</td>
                </tr>
            </table>
        </form>
    </body>
</html>
